name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: ubuntu-latest · py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[all]"
      - name: Lint (ruff)
        run: .venv/bin/python -m ruff check src tests
      - name: Tests
        run: .venv/bin/python -m pytest
      - name: Synthesize demo dataset
        run: .venv/bin/python -m policesight.cli data generate --cases 5000 --days 90 --seed 42 --out _synth
      - name: Quality gate
        run: .venv/bin/python -m policesight.cli data quality --data-dir _synth
      - name: Doctor smoke（退出码须 ≤1）
        run: |
          set +e
          .venv/bin/python -m policesight.cli doctor --data-dir _synth
          code=$?
          echo "doctor exit=$code"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          exit 0
